# CodeQL — compiled languages. Separate from codeql.yml (which covers
# interpreted/actions languages) per owner directive 2026-09-27 — added
# alongside, not merged into, ci/codeql-full-scan-revert-20260927.
name: CodeQL (compiled)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 0'
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: codeql-compiled-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        working-directory: example
        run: flutter pub get
      - name: flutter build ios (debug, no codesign)
        working-directory: example
        run: flutter build ios --no-codesign --debug
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
