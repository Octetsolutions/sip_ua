# pr-automerge caller — Octetsolutions standard (thin shim; logic lives in
# Octetsolutions/.github reusable @v2). workflow_run is the load-bearing
# post-CI trigger: check_suite events from GitHub Actions suites do NOT fire
# workflows, so without it labelled PRs only merged on the (throttled) cron.
name: pr-automerge

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  # Re-fire when required CI workflows complete.
  workflow_run:
    workflows: ["CodeQL", "Build", "gitleaks"]
    types: [completed]
  # Safety-net sweep (2026-09-25, replaces check_suite fan-out).
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  automerge:
    uses: Octet-Public/octet-workflows/.github/workflows/pr-automerge.yml@d7a0c4b0cec6e441ed10d89488487f8a368759b0  # v2.8.3
    secrets:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
      AUTOMERGE_APP_PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
    with:
      required_checks: '[]'
      merge_method: squash
      base_ci_workflow: 'dart.yml'
