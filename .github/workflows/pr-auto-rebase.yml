# .github/workflows/pr-auto-rebase.yml -- CALLER: DO NOT EDIT LOGIC HERE
# Logic lives in the ONE canonical copy: Octet-Public/octet-workflows/.github/workflows/pr-auto-rebase.yml
name: pr-auto-rebase
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch: {}
concurrency:
  group: pr-auto-rebase-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  rebase:
    uses: Octet-Public/octet-workflows/.github/workflows/pr-auto-rebase.yml@a60c14cb1281d616c27075443aa817b2f9224d00  # v2.17.1
    with:
      skip_commit_prefixes: |
        bone-marrow auto-sync
        kos-sync reconcile
        auto-settle
